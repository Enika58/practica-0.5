{% extends "base.html" %}

{% block title %}Новый запрос{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0"><i class="bi bi-plus-circle"></i> Создание нового запроса</h5>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="row mb-3">
                        <div class="col-md-8">
                            <label class="form-label">Тема запроса <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" name="title" required 
                                   placeholder="Краткое описание обращения">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Источник</label>
                            <select class="form-select" name="source">
                                <option value="phone">Телефон</option>
                                <option value="email">Email</option>
                                <option value="web">Веб-форма</option>
                                <option value="walk-in">Личный визит</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Описание <span class="text-danger">*</span></label>
                        <textarea class="form-control" name="description" rows="5" required 
                                  placeholder="Подробное описание обращения клиента"></textarea>
                    </div>
                    
                    <h6 class="mt-4 mb-3">Контактные данные клиента</h6>
                    
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label">Имя клиента</label>
                            <input type="text" class="form-control" name="client_name" placeholder="Иван Иванов">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Телефон</label>
                            <input type="tel" class="form-control" name="client_phone" placeholder="+7 (999) 123-45-67">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" name="client_email" placeholder="client@example.com">
                        </div>
                    </div>
                    
                    <h6 class="mt-4 mb-3">Классификация</h6>
                    
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label">Категория</label>
                            <select class="form-select" name="category_id">
                                <option value="">Выберите...</option>
                                {% for cat in categories %}
                                <option value="{{ cat.id }}">{{ cat.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Тип услуги</label>
                            <select class="form-select" name="service_type_id">
                                <option value="">Выберите...</option>
                                {% for st in service_types %}
                                <option value="{{ st.id }}">{{ st.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Приоритет</label>
                            <select class="form-select" name="priority">
                                <option value="low">Низкий</option>
                                <option value="medium" selected>Средний</option>
                                <option value="high">Высокий</option>
                                <option value="critical">Критический</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Теги</label>
                        <input type="text" class="form-control" name="tags" placeholder="тег1, тег2, тег3">
                        <div class="form-text">Разделите теги запятыми</div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-send"></i> Создать запрос
                    </button>
                    <a href="{{ url_for('requests.requests_list') }}" class="btn btn-secondary">Отмена</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
